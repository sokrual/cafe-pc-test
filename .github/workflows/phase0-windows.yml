# THROWAWAY BRANCH, never merged: the 8 test jobs are replaced by one measuring job for E3b
# (the lock screen on its own Windows desktop). Started by hand only.
name: windows-tests
on:
  workflow_dispatch:

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Close Windows first-time setup if the test machine never finished it
        shell: powershell
        run: Get-Process WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: E3b measurements (every printed line is a measurement; the job passes whatever they say)
        shell: pwsh
        run: dotnet run --project pc/Cafe.Measure -c Release
