# Runs the owner's kit end to end on GitHub's Windows machines before it goes to the cafe.
# windows-latest = Windows Server 2025. windows-11-arm = real Windows 11 (our x64 exe runs under emulation).
name: windows-tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: # every pull request gets the same 8 jobs before it is merged

# a new push to a pull request stops that pull request's older runs; only the latest commit needs testing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Billing, money and security tests (Phase 2)
        run: dotnet test --project Cafe.Tests
      - name: Known-vulnerable packages
        shell: pwsh
        run: |
          dotnet list Cafe.Tests package --vulnerable --include-transitive 2>&1 | Tee-Object -Variable v
          if ($v -match "has the following vulnerable packages") { exit 1 }

  pc-ui-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build the admin server and the PC program
        run: |
          dotnet publish server/Cafe.Server -c Release -o out/server
          dotnet publish pc/Cafe.Agent -c Release -o out/agent
          dotnet publish pc/Cafe.Watchdog -c Release -o out/watchdog
      - name: Close Windows first-time setup if the test machine never finished it (a set-up cafe PC never shows it)
        shell: powershell
        run: Get-Process WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Phase 1 on real Windows - escape keys, login, locks, admin PC offline, watchdog restart
        shell: pwsh
        run: |
          $env:CAFE_SERVER_EXE = "$PWD\out\server\Cafe.Server.exe"
          $env:CAFE_AGENT_EXE = "$PWD\out\agent\Cafe.Agent.exe"
          $env:CAFE_WATCHDOG_EXE = "$PWD\out\watchdog\Cafe.Watchdog.exe"
          dotnet test --project pc/Cafe.UiTests --output Detailed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-${{ matrix.os }}
          path: screen-*.png

  lockdown:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Lint the install scripts (PowerShell 5.1 rules)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $bad = "install", "ci" | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error -Settings @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @("5.1") } } } }
          $bad | Format-Table -AutoSize
          if ($bad) { exit 1 }
      - name: Build what the cafe PCs get (one x64 file each; no files unpacked to a temp folder, so Level A can allow them)
        shell: pwsh
        run: |
          $f = "-c", "Release", "-r", "win-x64", "--self-contained", "true", "-p:PublishSingleFile=true", "-p:DebugType=none"
          dotnet publish pc/Cafe.Agent @f -o out/agent
          dotnet publish pc/Cafe.Watchdog @f -o out/watchdog
          dotnet publish timer @f -o out/timer
          dotnet publish server/Cafe.Server @f -p:IncludeNativeLibrariesForSelfExtract=true -o out/server
          foreach ($d in "agent", "watchdog", "timer") { if (@(Get-ChildItem out/$d).Count -ne 1) { Get-ChildItem out/$d; throw "$d is more than one file" } }
      - name: Close Windows first-time setup if the test machine never finished it
        shell: powershell
        run: Get-Process WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: B3 lockdown - install, logout wipe, customer limits, Level A, uninstall
        shell: powershell
        run: .\ci\lockdown.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockdown-${{ matrix.os }}
          path: |
            lockdown-results.csv
            lockdown-logs/**
          if-no-files-found: warn

  kit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Code checks (PowerShell 5.1 lint, known-vulnerable packages)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $bad = "kit", "ci" | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error -Settings @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @("5.1") } } } }
          $bad | Format-Table -AutoSize
          if ($bad) { exit 1 }
          dotnet restore timer
          dotnet list timer package --vulnerable --include-transitive 2>&1 | Tee-Object -Variable v
          if ($v -match "has the following vulnerable packages") { exit 1 }

      - name: Build the timer exactly as shipped
        shell: pwsh
        run: dotnet publish timer -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out

      - name: Make the owner kit zip (only kept from a run where every job passed)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item kitzip -ItemType Directory | Out-Null
          Copy-Item kit\*, out\ShinzxTimerTest.exe kitzip
          Compress-Archive kitzip\* ShinzxPhase0.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: ShinzxPhase0
          path: ShinzxPhase0.zip

      - name: Put the kit where the owner puts it
        shell: powershell
        run: |
          New-Item C:\ShinzxTest -ItemType Directory -Force | Out-Null
          Copy-Item kit\* C:\ShinzxTest -Force
          Copy-Item out\ShinzxTimerTest.exe C:\ShinzxTest -Force
          "OS: " + (Get-CimInstance Win32_OperatingSystem).Caption
          "Is admin: " + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole("Administrators")

      # Round 1: first run on a clean PC
      - name: Round 1 START-TEST
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File C:\ShinzxTest\start.ps1 -Ci
      - name: Round 1 short day
        shell: powershell
        run: .\ci\simulate-day.ps1
      - name: Round 1 FINISH-TEST
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File C:\ShinzxTest\finish.ps1 -Ci -VoiceHeard No
      - name: Round 1 check
        shell: powershell
        run: .\ci\check.ps1 -Round 1

      # Round 2: the owner runs it again on the same PC (must start clean and restore again)
      - name: Round 2 START-TEST
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File C:\ShinzxTest\start.ps1 -Ci
      - name: Round 2 short day
        shell: powershell
        run: .\ci\simulate-day.ps1
      - name: Round 2 FINISH-TEST
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File C:\ShinzxTest\finish.ps1 -Ci -VoiceHeard No
      - name: Round 2 check
        shell: powershell
        run: .\ci\check.ps1 -Round 2

      # Round 3: FINISH-TEST clicked twice must not break anything
      - name: FINISH-TEST with no test running says so and exits 1
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\ShinzxTest\finish.ps1 -Ci
          if %ERRORLEVEL%==1 (exit /b 0) else (exit /b 1)

      - name: On failure, show the kit folder's permissions
        if: failure()
        shell: cmd
        run: |
          icacls C:\ShinzxTest
          icacls C:\ShinzxTest\ShinzxTimerTest.exe
          icacls C:\ShinzxTest\start.ps1

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            C:\ShinzxTest\*.zip
            C:\ShinzxTest\logs*\**
          if-no-files-found: warn
